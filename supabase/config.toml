# Supabase local config
# verify_jwt = false untuk endpoint yang dipanggil pihak ketiga / scheduler:
# - telegram-webhook (Telegram tidak kirim Authorization Supabase)
# - midtrans-webhook (Midtrans hanya kirim signature_key; verifikasi
#   dilakukan manual di kode via sha512 — JANGAN hapus)
# create-order & payment-status tetap butuh JWT (dipanggil frontend).

[functions.telegram-webhook]
verify_jwt = false

[functions.midtrans-webhook]
verify_jwt = false

